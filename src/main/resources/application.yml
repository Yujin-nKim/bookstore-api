server:
  port: 8080

spring:
  profiles:
    active: dev

  application:
    name: bookstore-service

  mvc:
    path-match:
      matching-strategy: ant_path_matcher

  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true

feature:
  enabled: false

t3t:
  swagger:
    title: "T3T Swagger"
    description: "T3T API Documentation"
    version: "v1"

eureka:
  client:
    enabled: false
